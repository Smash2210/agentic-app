[project]
name = "agentic-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "google-genai>=3.6.1",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
agentic-app = "agentic_app:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mutmut>=3.8.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is offline; live tests need: uv run pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: calls the real Gemini API (needs GOOGLE_API_KEY and GEMINI_MODEL)",
]

[tool.coverage.run]
source = ["agentic_app"]
branch = true

[tool.coverage.report]
show_missing = true

[tool.mutmut]
paths_to_mutate = ["src/agentic_app/"]
do_not_mutate = ["*/llm.py", "*/__init__.py"]
also_copy = ["data/"]
pytest_add_cli_args = ["--ignore=tests/claims/test_rules_purity.py", "--ignore=tests/test_package_import.py", "--ignore=tests/claims/test_app.py"]