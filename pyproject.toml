[project]
name = "agentic-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.165.0",
    "google-adk>=2.15.1",
    "google-cloud-aiplatform[agent-engines]>=2.10",
    "google-genai>=2.34,<3",
    "python-dotenv>=1.2.4",
    "rank-bm25>=0.2.2",
    "uvicorn>=0.54.0",
]

[project.scripts]
agentic-app = "agentic_app:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "hypothesis>=6.170.17",
    "mutmut>=3.8.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is offline; live tests need: uv run pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: calls the real Gemini API (needs GOOGLE_API_KEY and GEMINI_MODEL)",
]

[tool.coverage.run]
source = ["agentic_app"]
branch = true

[tool.coverage.report]
show_missing = true
# 90%: current total is 93%. A 3-point margin lets a refactor move a few lines without failing,
# but a module losing its tests (e.g. rules.py at 100% with ~120 statements) drops the total
# below 90 and fails the build. Raise it as coverage grows; never lower it to make a PR pass.
fail_under = 90

[tool.mutmut]
paths_to_mutate = ["src/agentic_app/"]
do_not_mutate = ["*/llm.py", "*/__init__.py"]
also_copy = ["data/"]
pytest_add_cli_args = ["--ignore=tests/claims/test_rules_purity.py", "--ignore=tests/test_package_import.py", "--ignore=tests/claims/test_app.py"]

[tool.ruff]
line-length = 100
extend-exclude = [".specify"]

[tool.ruff.lint]
# Correctness only: syntax/style errors (E) and real bugs like unused imports or undefined names (F).
# Line length (E501) is left to a later formatter decision, so it doesn't gate.
select = ["E", "F"]
ignore = ["E501"]
