[project]
name = "agentic-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "google-genai>=3.6.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
agentic-app = "agentic_app:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Default run is offline; live tests need: uv run pytest -m live
addopts = "-m 'not live'"
markers = [
    "live: calls the real Gemini API (needs GOOGLE_API_KEY and GEMINI_MODEL)",
]
