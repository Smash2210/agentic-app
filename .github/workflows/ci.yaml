name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install (exact versions from uv.lock)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Tests + coverage gate (fail_under in pyproject.toml)
        run: uv run pytest --cov --cov-report=term-missing

      - name: OpenAPI spec is up to date
        run: uv run python scripts/exports_openapi.py --check

      - name: Agent eval regression gate (replay of recorded model responses, no key)
        run: uv run python evals/run.py --gate
