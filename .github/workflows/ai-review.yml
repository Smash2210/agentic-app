name: ai-review

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write   # only to post the verdict comment

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, so the diff against the base branch works

      - uses: astral-sh/setup-uv@v6

      - run: uv sync --locked

      - name: AI review gate (blocks on spec violation or high-risk finding)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_MODEL: gemini-3.5-flash-lite
        run: uv run python review/run_review.py --base origin/${{ github.base_ref }}

      - name: Post the verdict on the PR
        if: always() && hashFiles('review-verdict.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr comment ${{ github.event.pull_request.number }} --body-file review-verdict.md